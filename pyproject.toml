[project]
name = "koven-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "discord>=2.3.2",
    "discord-py>=2.6.4",
    "dishka>=1.8.0",
    "pydantic-settings>=2.13.1",
    "sqlmodel>=0.0.37",
]

[dependency-groups]
dev = ["ruff>=0.15.2"]
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "ANN", "UP"]
